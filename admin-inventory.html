<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory — NVM Store Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<style>
  .inventory-search-bar { margin-bottom: 20px; display: flex; gap: 10px; }
  .inventory-search-bar input { flex: 1; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--a-border); font-size: 0.9rem; }
  .inventory-product-card { background: var(--a-paper); border: 1px solid var(--a-border); border-radius: var(--a-radius-lg); padding: 22px; margin-bottom: 22px; box-shadow: var(--a-shadow); }
  .inv-header { display: flex; gap: 20px; align-items: flex-start; margin-bottom: 20px; }
  .inv-thumb { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; border: 1px solid var(--a-border); }
  .inv-info { flex: 1; }
  .inv-title { font-family: 'Archivo Black', sans-serif; font-size: 1.2rem; margin-bottom: 4px; }
  .inv-sku { font-family: 'Space Mono', monospace; font-size: 0.8rem; color: var(--a-ink-soft); }

  .inv-variants-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .inv-variants-table th { text-align: left; font-size: 0.75rem; text-transform: uppercase; color: var(--a-ink-soft); padding-bottom: 8px; border-bottom: 1px solid var(--a-border); }
  .inv-variants-table td { padding: 10px 0; border-bottom: 1px solid var(--a-border); font-size: 0.85rem; vertical-align: middle; }
  .inv-variants-table tr:last-child td { border-bottom: none; }

  .stock-input-wrap { display: flex; align-items: center; gap: 6px; }
  .stock-input-wrap input { width: 70px; padding: 6px 10px; border: 1px solid var(--a-border); border-radius: 8px; text-align: center; }
  .stock-btn { background: var(--a-bg); border: 1px solid var(--a-border); border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
  .stock-btn:hover { background: #e0e0e0; }

  .low-stock-badge { background: rgba(178,52,52,0.12); color: var(--a-red); font-size: 0.7rem; padding: 2px 8px; border-radius: 99px; font-weight: 700; margin-left: 10px; display: none; }
  .low-stock .low-stock-badge { display: inline-block; }
</style>
</head>
<body>

<div class="admin-shell">

  <!-- SIDEBAR -->
  <aside class="admin-sidebar" id="adminSidebarMount"></aside>

  <!-- MAIN -->
  <main class="admin-main">

    <div class="admin-header">
      <h1>Inventory Management</h1>
      <p>Track stock levels for every product and variant. Settings are saved automatically.</p>
    </div>

    <div class="inventory-search-bar">
      <input type="text" id="invSearch" placeholder="Search by product name or SKU prefix...">
    </div>

    <div id="inventoryContainer">
      <!-- Generated by JS -->
    </div>

    <!-- TOAST -->
    <div class="admin-toast" id="adminToast"></div>

  </main>

</div>

<script src="js/admin-sidebar.js"></script>
<script src="js/admin-data.js"></script>
<script src="js/admin-inventory-data.js"></script>
<script src="js/admin-inventory.js"></script>
</body>
</html>
