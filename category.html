<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category — NVM Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap has-hero">

  <!-- PILL NAV -->
<div class="pill-nav-wrap">

  <!-- Mobile menu drawer trigger -->
  <button type="button" class="menu-btn" id="menuToggleBtn" aria-label="Open menu" title="Menu">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
      <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </button>

  <a class="brand" href="index.html">NVM Store</a>

  <!-- Centered navigation -->
  <nav class="pill-nav">
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="collections.html" class="active">Collections</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Cart drawer trigger -->
  <button type="button" class="cart-btn" id="cartToggleBtn" aria-label="Open cart" title="Cart">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
      <path
        d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h8.2a2 2 0 0 0 2-1.6L21 8H6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"/>
    </svg>
    <span class="badge" id="navCartCount">0</span>
  </button>

</div>

<!-- CATEGORY HERO -->
  <div id="categoryHero" style="
      position: relative;
      width: 100%;
      height: 450px; /* You can adjust this height if you want the image taller/shorter */
      background-color: #111;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end; /* Pushes the text down towards the bottom */
      justify-content: center; /* Centers the text horizontally */
      padding-bottom: 50px; /* Creates a little breathing room from the bottom edge */
  ">
      <!-- Dark gradient overlay so the white text always pops against bright images -->
      <div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 60%); z-index: 1;"></div>
      
      <!-- The Category Title -->
      <h1 id="categoryTitle" style="
          position: relative; 
          z-index: 2; 
          color: #ffffff; 
          font-family: 'Archivo Black', sans-serif; 
          font-size: 2.2rem; /* Made the font smaller (was likely 3rem+) */
          text-align: center;
          margin: 0;
          text-shadow: 0 4px 12px rgba(0,0,0,0.8);
          letter-spacing: 1px;
      ">
          Collection Title
      </h1>
  </div>
  
  <!-- PRODUCT GRID (filled in by category.js) -->
  <h2 class="category-section-title" id="categoryGridTitle">Shop the Collection</h2>
  <div class="product-grid" id="categoryProductGrid">
    <div class="loading-state">Loading products...</div>
  </div>

  <!-- CATEGORY GALLERY -->
  <h2 class="category-section-title">Product Gallery</h2>
  <div class="category-gallery" id="categoryGallery"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-drawer.js"></script>
<script src="js/nav-drawer.js"></script>
<script src="js/product-card.js"></script>
<script src="js/category.js"></script>
</body>
</html>
