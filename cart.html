<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — NVM Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">

<!-- PILL NAV -->
<div class="pill-nav-wrap">

  <!-- Cart - left side -->
  <a href="cart.html" class="cart-btn" aria-label="View cart" title="Cart">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
      <path
        d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h8.2a2 2 0 0 0 2-1.6L21 8H6"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>

    <span class="badge" id="navCartCount">0</span>
  </a>

  <!-- Main navigation - centered -->
  <nav class="pill-nav">
    <a href="index.html" class="active">⌂ Home</a>
    <a href="shop.html">Shop</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="#categories">Collections</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="admin.html">Admin</a>
  </nav>

</div>

  <div class="cart-header">
    <h1>Your Cart</h1>
  </div>

  <div class="cart-wrap">
    <div id="cart-items">
      <!-- filled in by cart-page.js -->
    </div>

    <div id="cart-empty" class="cart-empty" style="display:none;">
      Your cart is empty. <a href="shop.html">Browse the shop →</a>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="cart-summary-row">
        <span>Subtotal</span>
        <span id="cart-total">$0.00</span>
      </div>
      <div class="cart-summary-total">
        <span>Total</span>
        <span id="cart-total-2">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
