<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Cart — NEXORA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Manrope:wght@400;500;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-wrap">

  <!-- NAV -->
  <nav class="navbar">
    <ul class="nav-links">
      <li><a href="shop.html">Shop</a></li>
      <li><a href="index.html#new">New In</a></li>
      <li><a href="index.html#collections">Collections</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <a class="brand" href="index.html">NEXORA</a>
    <div class="nav-right">
      <button class="icon-btn" aria-label="Search" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="avatar" title="Account"></div>
      <a href="cart.html" class="cart-pill" aria-label="View cart">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.8h8.2a2 2 0 0 0 2-1.6L21 8H6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="9" cy="21" r="1" fill="currentColor"/><circle cx="18" cy="21" r="1" fill="currentColor"/></svg>
        <span id="navCartCount">0 items</span>
      </a>
    </div>
  </nav>

  <div class="cart-header">
    <h1>Your Cart</h1>
  </div>

  <div class="cart-wrap">
    <div id="cart-items">
      <!-- filled in by cart-page.js -->
    </div>

    <div id="cart-empty" class="cart-empty" style="display:none;">
      Your cart is empty. <a href="shop.html">Browse the shop →</a>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="cart-summary-row">
        <span>Subtotal</span>
        <span id="cart-total">$0.00</span>
      </div>
      <div class="cart-summary-total">
        <span>Total</span>
        <span id="cart-total-2">$0.00</span>
      </div>
      <button class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/cart.js"></script>
<script src="js/cart-page.js"></script>
</body>
</html>
