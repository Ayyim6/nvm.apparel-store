<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods — NVM Store Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebarMount"></aside>
<main class="admin-main">
    <div class="admin-header">
      <h1>Payment Methods</h1>
      <p>Manage payment options available to customers during checkout.</p>
    </div>
    
    <div id="paymentListContainer">
       <!-- JS RENDERED -->
    </div>
    <button class="admin-add-btn" id="addPaymentBtn">+ Add New Payment Method</button>

    <div class="admin-form-actions" style="margin-top:20px;">
        <button id="savePaymentBtn" class="admin-export-btn">Save Payment Methods</button>
    </div>
    <div class="admin-toast" id="adminToast"></div>
  </main>
</div>
<script src="js/admin-sidebar.js"></script>
<script src="js/admin-payment.js"></script>
</body>
</html>
